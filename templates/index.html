<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} | 100% Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5), 0 0 20px rgba(74, 222, 128, 0.3);
        }
    </style>
</head>
<body class="p-4 relative">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl border border-white/20 text-center animate-float z-10">
        
        <div class="mb-6">
            <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto shadow-[0_0_20px_rgba(34,197,94,0.5)]">

        </div>

            </p>
            <p class="text-sm font-normal text-gray-300 mt-4 border-t border-white/20 pt-4">
                যাদের লাগবে তারা নিচের বাটনে ক্লিক করে ইনবক্স করুন
            </p>
        </div>

        <div class="space-y-4">
            <a href="https://t.me/axromjanhossain" target="_blank"

                <i class="fa-brands fa-telegram text-2xl"></i>
                Telegram এ মেসেজ দিন
            </a>

            <a href="https://wa.me/+8801851410304" target="_blank" 
               class="flex items-center justify-center gap-3 w-full bg-green-600 hover:bg-green-700 text-white py-3 px-6 rounded-xl font-bold transition-all duration-300 transform hover:scale-105 shadow-lg">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                WhatsApp এ মেসেজ দিন
            </a>
        </div>
    </div>

    <!-- Encrypted Credit -->
    <div class="absolute bottom-4 text-center w-full text-slate-400/50 text-sm font-mono z-0">
        {{ credit }}
    </div>

</body>
</html>
