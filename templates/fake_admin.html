<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* ব্যাকগ্রাউন্ড কালো রাখা হয়েছে */
            overflow: hidden; /* স্ক্রলবার হাইড করা হয়েছে */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .full-screen-img {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* ছবি যাতে না কাটে তাই contain ব্যবহার করা হয়েছে */
        }
    </style>
</head>
<body>
    <img src="https://iili.io/CvNXKy7.jpg" alt="Access Denied" class="full-screen-img">
</body>
</html>
